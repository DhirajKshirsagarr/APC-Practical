<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: linear-gradient(135deg, #eef2ff, #f8fafc 55%, #e0f2fe); }
    .card { width: min(100%, 420px); padding: 40px; background: #fff; border: 1px solid #e5e7eb; border-radius: 20px; box-shadow: 0 20px 60px #1e293b14; }
    .mark { display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: 24px; border-radius: 14px; color: white; background: #4f46e5; font-size: 22px; font-weight: 700; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.03em; }
    .intro { margin: 0 0 28px; color: #64748b; line-height: 1.5; }
    label { display: block; margin: 18px 0 8px; font-size: 14px; font-weight: 600; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; outline: none; }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px #6366f122; }
    button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 10px; color: white; background: #4f46e5; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #4338ca; }
    .error { margin: 0 0 14px; padding: 11px 12px; border-radius: 9px; color: #b91c1c; background: #fef2f2; font-size: 14px; }
    @media (max-width: 480px) { .card { padding: 28px 22px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">D</div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to continue to your account.</p>
    {% if form.errors %}
      <p class="error" role="alert">Username ya password sahi nahi hai. Dobara try karein.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
