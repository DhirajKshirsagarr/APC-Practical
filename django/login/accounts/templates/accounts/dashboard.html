<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f1f5f9;
      }
      main {
        width: min(100%, 520px);
        padding: 40px;
        border-radius: 18px;
        background: white;
        box-shadow: 0 16px 48px #0f172a12;
      }
      h1 {
        margin-top: 0;
      }
      p {
        color: #64748b;
      }
      button {
        padding: 11px 16px;
        border: 0;
        border-radius: 9px;
        color: white;
        background: #4f46e5;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, {{ request.user.username }}!</h1>
      <p>login successfully</p>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    </main>
  </body>
</html>
